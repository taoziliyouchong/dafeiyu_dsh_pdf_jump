<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:180px;height:180px;background:#1f2430;overflow:hidden}
.page{position:absolute;left:35px;top:20px;width:110px;height:140px;background:#fff;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.line{position:absolute;left:16px;height:7px;border-radius:4px;background:#d5dbe5}
.line.a{top:26px;width:78px}
.line.b{top:44px;width:64px}
.line.c{top:62px;width:72px}
.line.d{top:80px;width:48px}
.badge{position:absolute;right:12px;bottom:12px;background:#2f81f7;color:#fff;font:700 22px/1 system-ui,sans-serif;padding:6px 9px;border-radius:8px;letter-spacing:.5px}
.ribbon{position:absolute;left:14px;top:-7px;width:18px;height:34px;background:#2f81f7;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);border-radius:3px 3px 0 0}
</style></head><body>
<div class="page"><div class="ribbon"></div><div class="line a"></div><div class="line b"></div><div class="line c"></div><div class="line d"></div><div class="badge">45</div></div>
</body></html>
